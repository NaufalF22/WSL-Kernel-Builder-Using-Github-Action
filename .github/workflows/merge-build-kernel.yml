name: Merge and Build Kernel

on:
  workflow_dispatch:
    inputs:
      msft_branch:
        description: 'MSFT branch to fetch'
        required: false
        default: 'linux-msft-wsl-6.18.y'
      kernel_ref:
        description: 'kernel.org git ref or tag (e.g. linux-7.1.2 or linux-7.1.y)'
        required: false
        default: 'linux-7.1.2'
      use_tarball:
        description: 'If true, download kernel tarball instead of cloning git (less recommended)'
        required: false
        default: 'true'
      build_deb:
        description: 'Produce Debian packages'
        required: false
        default: 'false'

jobs:
  merge-build:
    # Default to self-hosted but you can edit this file to use ubuntu-latest if you don't have a self-hosted runner.
    runs-on: [ubuntu-latest]
    env:
      MSFT_REMOTE: https://github.com/microsoft/WSL2-Linux-Kernel.git
      KERNEL_GIT: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
      WORKDIR: ${{ github.workspace }}/kernel-work

    steps:
      - name: Checkout workflow repo (for scripts/artifacts)
        uses: actions/checkout@v4
        
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
      - name: Prepare workdir
        run: |
          rm -rf "${WORKDIR}"
          mkdir -p "${WORKDIR}"

      - name: Fetch kernel source (git or tarball)
        run: |
          set -euo pipefail
          cd "${WORKDIR}"

          # Normalize kernel_ref and derive tarball name when needed
          KREF="${{ github.event.inputs.kernel_ref }}"

          if [ "${{ github.event.inputs.use_tarball }}" = "true" ]; then
            TARBALL="${KREF}.tar.xz"
            echo "Downloading tarball from kernel.org: ${TARBALL}"
            curl -L -o "${TARBALL}" "https://cdn.kernel.org/pub/linux/kernel/v7.x/${TARBALL}" || { echo "Tarball download failed"; exit 1; }
            mkdir src && tar -xJf "${TARBALL}" -C src --strip-components=1
            cd src
            git init
            git add -A
            git commit -m "Import ${TARBALL} from kernel.org"
          else
            echo "Cloning kernel.org stable repo (shallow)..."
            git clone --depth=1 --branch "${KREF}" "${KERNEL_GIT}" src || (
              echo "Shallow clone of ${KREF} failed, falling back to linux-7.1.y shallow clone and trying to fetch ${KREF}" && 
              git clone --depth=1 --branch linux-7.1.y "${KERNEL_GIT}" src && 
              cd src && git fetch --depth=1 origin "${KREF}" && git checkout "${KREF}" || true
            )
            cd src
          fi

      - name: Add MSFT remote & fetch branch
        run: |
          set -euo pipefail
          echo "${WORKDIR}/msft"
          cd "${WORKDIR}/msft"
          git remote add msft "${MSFT_REMOTE}" || git remote set-url msft "${MSFT_REMOTE}"
          git fetch --no-tags --depth=1 msft "${{ github.event.inputs.msft_branch }}" || { echo "Failed to fetch msft/${{ github.event.inputs.msft_branch }}"; exit 2; }
        shell: bash

      - id: merge
        name: Create merge branch and force merge (keeping Linux changes)
        run: |
          set -euo pipefail
          cd "${WORKDIR}/src"
          git checkout -B merge-msft-"${{ github.event.inputs.msft_branch }}"

          if [ "${{ github.event.inputs.use_tarball }}" = "true" ]; then
           git merge --allow-unrelated-histories --no-edit -X ours "msft/${{ github.event.inputs.msft_branch }}" || true
                    else
                      git merge --no-edit -X ours "msft/${{ github.event.inputs.msft_branch }}" || true
                    fi
          
                    # Resolve any remaining conflicts by taking Linux version (ours)
                    git diff --name-only --diff-filter=U | while read file; do
                      echo "Resolving conflict in $file: keeping Linux version"
                      git checkout --ours "$file"
                      git add "$file"
                    done || true
          
                    # Complete the merge
                    if git diff --cached --quiet; then
                      # Nothing staged, check if there are uncommitted changes
                      if ! git diff --quiet; then
                        git add -A
                      fi
                    fi
          
                    # Check if we're in the middle of a merge
                    if [ -f .git/MERGE_HEAD ]; then
                      git commit --no-edit || echo "Merge already committed"
                    fi
          
                    echo "merge_failed=false" >> "$GITHUB_OUTPUT"
        shell: bash
        
      - name: Remove files not in MSFT branch (keep only MSFT files)
        if: steps.merge.outputs.merge_failed == 'false'
        run: |
          set -euo pipefail
          cd "${WORKDIR}/src"
          
          echo "Getting list of files in MSFT branch..."
          MSFT_FILES=$(git ls-tree -r --name-only "msft/${{ github.event.inputs.msft_branch }}" | sort)
          
          echo "Getting list of files in current HEAD..."
          LINUX_FILES=$(git ls-tree -r --name-only HEAD | sort)
          
          # Create temp files to avoid broken pipes
          echo "$MSFT_FILES" > /tmp/msft_files.txt
          echo "$LINUX_FILES" > /tmp/linux_files.txt
          
          # Find files that exist in Linux but NOT in MSFT, and delete them
          while IFS= read -r file; do
            if ! grep -q "^${file}$" /tmp/msft_files.txt; then
              if [ -f "$file" ]; then
                echo "Removing file not in MSFT: $file"
                git rm "$file" 2>/dev/null || rm -f "$file"
              fi
            fi
          done < /tmp/linux_files.txt
          
          # Cleanup temp files
          rm -f /tmp/msft_files.txt /tmp/linux_files.txt
          rm -f ${WORKDIR}/msft
          
          # Stage any deletions
          git add -A || true
          
          # Commit if there are staged changes
          if ! git diff --cached --quiet; then
            git commit -m "Remove files not present in MSFT branch - keep only MSFT files" || true
          fi
          
          echo "Disk space after cleanup:"
          du -sh "${WORKDIR}/src" || true
        shell: bash
        
      - name: Install build dependencies (self-hosted runner must permit sudo)
        if: steps.merge.outputs.merge_failed == 'false'
        run: |
          set -euo pipefail
          # Adjust this block if your self-hosted runner uses a non-Debian distro
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc fakeroot dpkg-dev curl cpio qemu-utils dwarves
        shell: bash

      - name: Configure kernel
        if: steps.merge.outputs.merge_failed == 'false'
        run: |
          set -euo pipefail
          cd "${WORKDIR}/src"
          if [ -f Microsoft/config-wsl ]; then
            cp Microsoft/config-wsl .config
            make olddefconfig
          elif [ -f /boot/config-$(uname -r) ]; then
            cp /boot/config-$(uname -r) .config
            make olddefconfig
          else
            make defconfig
          fi
        shell: bash

      - name: Build kernel (and optionally debs)
        if: steps.merge.outputs.merge_failed == 'false'
        run: |
          set -euo pipefail
          cd "${WORKDIR}/src"
          JOBS=$(nproc || echo 1)
          if [ "${{ github.event.inputs.build_deb }}" = "true" ]; then
            fakeroot make -j"${JOBS}" deb-pkg LOCALVERSION=-msft
            ls -lh .. || true
          else
            make -j"${JOBS}"
            sudo make modules_install || true
            sudo make install || true
          fi
        shell: bash

      - name: Upload build artifacts
        if: steps.merge.outputs.merge_failed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-artifacts
          path: |
            ${WORKDIR}/src/arch/*/boot/*
            ${WORKDIR}/src/*.deb
            ${WORKDIR}/src/../*.deb
            ${WORKDIR}/src/*.tar.gz
