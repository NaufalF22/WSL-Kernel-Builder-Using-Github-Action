name: Merge and Build Kernel

on:
  workflow_dispatch:
    inputs:
      msft_branch:
        description: 'MSFT branch to fetch'
        required: false
        default: 'linux-msft-wsl-6.18.y'
      kernel_ref:
        description: 'kernel.org git ref or tag (e.g. linux-7.1.2 or linux-7.1.y)'
        required: false
        default: 'linux-7.1.2'
      use_tarball:
        description: 'If true, download kernel tarball instead of cloning git (less recommended)'
        required: false
        default: 'true'
      build_deb:
        description: 'Produce Debian packages'
        required: false
        default: 'false'

jobs:
  merge-build:
    runs-on: [ubuntu-latest]
    env:
      MSFT_REMOTE: https://github.com/microsoft/WSL2-Linux-Kernel.git
      KERNEL_GIT: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
      WORKDIR: ${{ github.workspace }}/kernel-work

    steps:
      - name: Checkout workflow repo (for scripts/artifacts)
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Prepare workdir
        run: |
          rm -rf "${WORKDIR}"
          mkdir -p "${WORKDIR}"

      - name: Fetch kernel source (git or tarball)
        run: |
          set -euo pipefail
          cd "${WORKDIR}"

          # Normalize kernel_ref and derive tarball name when needed
          KREF="${{ github.event.inputs.kernel_ref }}"

          if [ "${{ github.event.inputs.use_tarball }}" = "true" ]; then
            TARBALL="${KREF}.tar.xz"
            echo "Downloading tarball from kernel.org: ${TARBALL}"
            curl -L -o "${TARBALL}" "https://cdn.kernel.org/pub/linux/kernel/v7.x/${TARBALL}" || { echo "Tarball download failed"; exit 1; }
            mkdir src && tar -xJf "${TARBALL}" -C src --strip-components=1
            cd src
            git init
            git add -A
            git commit -m "Import ${TARBALL} from kernel.org"
          else
            echo "Cloning kernel.org stable repo (shallow)..."
            git clone --depth=1 --branch "${KREF}" "${KERNEL_GIT}" src || (
              echo "Shallow clone of ${KREF} failed, falling back to linux-7.1.y shallow clone and trying to fetch ${KREF}" && 
              git clone --depth=1 --branch linux-7.1.y "${KERNEL_GIT}" src && 
              cd src && git fetch --depth=1 origin "${KREF}" && git checkout "${KREF}" || true
            )
            cd src
          fi
        shell: bash

      - id: fetch_msft
        name: Clone MSFT into separate folder
        run: |
          set -euo pipefail
          cd "${WORKDIR}"
          rm -rf msft_src || true
          # Try a shallow clone of the MSFT branch into msft_src
          if git clone --depth=1 --branch "${{ github.event.inputs.msft_branch }}" "${MSFT_REMOTE}" msft_src 2>/dev/null; then
            echo "Cloned msft/${{ github.event.inputs.msft_branch }} into msft_src"
            echo "msft_failed=false" >> "$GITHUB_OUTPUT"
          else
            # Fallback: clone default branch then try to fetch the requested branch
            if git clone --depth=1 "${MSFT_REMOTE}" msft_src 2>/dev/null; then
              cd msft_src
              if git fetch --depth=1 origin "${{ github.event.inputs.msft_branch }}" && git checkout "${{ github.event.inputs.msft_branch }}"; then
                echo "Fetched msft/${{ github.event.inputs.msft_branch }} into msft_src"
                echo "msft_failed=false" >> "$GITHUB_OUTPUT"
              else
                echo "Failed to fetch msft/${{ github.event.inputs.msft_branch }}" >&2
                echo "msft_failed=true" >> "$GITHUB_OUTPUT"
                exit 2
              fi
            else
              echo "Failed to clone MSFT repo" >&2
              echo "msft_failed=true" >> "$GITHUB_OUTPUT"
              exit 2
            fi
          fi
        shell: bash

      - name: Copy arch/x86/configs/ from MSFT (prefer MSFT files)
        if: steps.fetch_msft.outputs.msft_failed == 'false'
        run: |
          set -euo pipefail
          cd "${WORKDIR}/src"

          # Delete the existing arch/x86/configs directory
          if [ -d "arch/x86/configs" ]; then
            echo "Deleting arch/x86/configs/..."
            git rm -r arch/x86/configs/ 2>/dev/null || rm -rf arch/x86/configs/
          fi

          # Copy arch/x86/configs/ from MSFT
          if [ -d "${WORKDIR}/msft_src/arch/x86/configs" ]; then
            echo "Copying arch/x86/configs/ from MSFT..."
            mkdir -p arch/x86/configs
            cp -rf "${WORKDIR}/msft_src/arch/x86/configs/"* arch/x86/configs/ 2>/dev/null || true
            git add arch/x86/configs/ || true
            if ! git diff --cached --quiet; then
            git commit -m "Replace arch/x86/configs with MSFT version" || true
            fi
          else
            echo "Warning: MSFT arch/x86/configs/ not found"
          fi
        shell: bash
      - name: Delete Linux-only files (keep overlapping files unchanged)
        if: steps.fetch_msft.outputs.msft_failed == 'false'
        run: |
          set -euo pipefail
          cd "${WORKDIR}/src"

          echo "Listing files in msft_src..."
          (cd "${WORKDIR}/msft_src" && git ls-tree -r --name-only HEAD | sort) > /tmp/msft_files.txt || true
          echo "Listing files in linux src..."
          git ls-tree -r --name-only HEAD | sort > /tmp/linux_files.txt || true

          echo "Linux-only files to be removed (not present in MSFT):"
          while IFS= read -r file; do
            if ! grep -qFx "$file" /tmp/msft_files.txt; then
              if [ -f "$file" ]; then
                echo "$file"
              fi
            fi
          done < /tmp/linux_files.txt > /tmp/linux_only_files.txt || true

          # Remove Linux-only files (leave overlapping files unchanged)
          if [ -s /tmp/linux_only_files.txt ]; then
            while IFS= read -r file; do
              echo "Removing Linux-only file: $file"
              git rm "$file" 2>/dev/null || rm -f "$file"
            done < /tmp/linux_only_files.txt
          else
            echo "No Linux-only files found; nothing to remove."
          fi

          # Cleanup temp lists
          rm -f /tmp/msft_files.txt /tmp/linux_files.txt /tmp/linux_only_files.txt || true

          # Commit removals if any
          git add -A || true
          if ! git diff --cached --quiet; then
            git commit -m "Remove files not present in MSFT branch (kept overlapping files unchanged)" || true
          else
            echo "No deletions to commit"
          fi

          # Remove msft clone to free space and garbage collect
          cd "${WORKDIR}"
          rm -rf msft_src || true
          cd "${WORKDIR}/src"
          git reflog expire --all --expire=now || true
          git gc --prune=now --aggressive || true

          echo "Disk usage for ${WORKDIR}/src after cleanup:"
          du -sh "${WORKDIR}/src" || true
        shell: bash

      - name: Install build dependencies (self-hosted runner must permit sudo)
        if: steps.fetch_msft.outputs.msft_failed == 'false'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc fakeroot dpkg-dev curl cpio qemu-utils dwarves
        shell: bash

      #- name: Configure kernel with all features enabled
        #if: steps.fetch_msft.outputs.msft_failed == 'false'
        #run: |
          #set -euo pipefail
          #cd "${WORKDIR}/src"
          #echo "Generating kernel config with all features enabled (allyesconfig)..."
          #make allyesconfig
        #shell: bash

      - name: Build kernel (and optionally debs)
        if: steps.fetch_msft.outputs.msft_failed == 'false'
        run: |
          set -euo pipefail
          cd "${WORKDIR}/src"
          
          # Use the WSL config file from arch/x86/configs
          echo "Applying KCONFIG_CONFIG=${WORKDIR}/src/arch/x86/configs/config-wsl"
          make KCONFIG_CONFIG=${WORKDIR}/src/arch/x86/configs/config-wsl
          
          JOBS=$(nproc || echo 1)
            make -j"${JOBS}"
            sudo make modules_install || true
            sudo make install || true
          fi
        shell: bash

      - name: Upload build artifacts
        if: steps.fetch_msft.outputs.msft_failed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-artifacts
          path: |
            ${WORKDIR}/src/arch/*/boot/*
            ${WORKDIR}/src/*.deb
            ${WORKDIR}/src/../*.deb
            ${WORKDIR}/src/*.tar.gz
