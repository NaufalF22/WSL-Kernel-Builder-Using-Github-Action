name: Merge and Build Kernel

on:
  workflow_dispatch:
    inputs:
      msft_branch:
        description: 'MSFT branch to fetch'
        required: false
        default: 'linux-msft-wsl-6.18.y'
      linux_branch:
        description: 'Linux branch to fetch'
        required: false
        default: linux-rolling-stable
      build_deb:
        description: 'Produce Debian packages'
        required: false
        default: 'false'

jobs:
  merge-build:
    runs-on: [ubuntu-slim]
    env:
      MSFT_REMOTE: https://github.com/microsoft/WSL2-Linux-Kernel.git
      KERNEL_GIT: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
      WORKDIR: ${{ github.workspace }}/kernel-work

    steps:
      - name: Checkout workflow repo (for scripts/artifacts)
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Prepare workdir
        run: |
          rm -rf "${WORKDIR}"
          mkdir -p "${WORKDIR}"
          echo "Disk usage:"
          df -h || true
          du -sh . || true

      - name: Fetch kernel source 
        run: |
          set -euo pipefail
          cd "${WORKDIR}"

          # Normalize kernel_ref and derive tarball name when needed
            echo "Cloning kernel.org stable repo (shallow)..."
            git clone --depth=1 --branch "${{ github.event.inputs.linux_branch }}" "${KERNEL_GIT}" src || 
            cd src
        shell: bash

      - id: fetch_msft
        name: Clone MSFT into separate folder
        run: |
          set -euo pipefail
          cd "${WORKDIR}"
          rm -rf msft_src || true
          # Try a shallow clone of the MSFT branch into msft_src
          if git clone --depth=1 --branch "${{ github.event.inputs.msft_branch }}" "${MSFT_REMOTE}" msft_src 2>/dev/null; then
            echo "Cloned msft/${{ github.event.inputs.msft_branch }} into msft_src"
            echo "msft_failed=false" >> "$GITHUB_OUTPUT"
          else
            # Fallback: clone default branch then try to fetch the requested branch
            if git clone --depth=1 "${MSFT_REMOTE}" msft_src 2>/dev/null; then
              cd msft_src
              if git fetch --depth=1 origin "${{ github.event.inputs.msft_branch }}" && git checkout "${{ github.event.inputs.msft_branch }}"; then
                echo "Fetched msft/${{ github.event.inputs.msft_branch }} into msft_src"
                echo "msft_failed=false" >> "$GITHUB_OUTPUT"
              else
                echo "Failed to fetch msft/${{ github.event.inputs.msft_branch }}" >&2
                echo "msft_failed=true" >> "$GITHUB_OUTPUT"
                exit 2
              fi
            else
              echo "Failed to clone MSFT repo" >&2
              echo "msft_failed=true" >> "$GITHUB_OUTPUT"
              exit 2
            fi
          fi
        shell: bash

      - name: Copy arch/x86/configs/ from MSFT (prefer MSFT files)
        if: steps.fetch_msft.outputs.msft_failed == 'false'
        run: |
          set -euo pipefail
          cd "${WORKDIR}/src"

          # Delete the existing arch/x86/configs directory
          if [ -d "arch/x86/configs" ]; then
            echo "Deleting arch/x86/configs/..."
            git rm -r arch/x86/configs/ 2>/dev/null || rm -rf arch/x86/configs/
          fi

          # Copy arch/x86/configs/ from MSFT
          if [ -d "${WORKDIR}/msft_src/arch/x86/configs" ]; then
            echo "Copying arch/x86/configs/ from MSFT..."
            mkdir -p arch/x86/configs
            cp -rf "${WORKDIR}/msft_src/arch/x86/configs/"* arch/x86/configs/ 2>/dev/null || true
            git add arch/x86/configs/ || true
            if ! git diff --cached --quiet; then
            git commit -m "Replace arch/x86/configs with MSFT version" || true
            fi
          else
            echo "Warning: MSFT arch/x86/configs/ not found"
          fi
          #copy microsoft folder
          cp -rf "${WORKDIR}/msft_src/Microsoft/"* ${WORKDIR}/src/ 2>/dev/null || true
        shell: bash
        
      - name: Delete MSFT folder
        if: steps.fetch_msft.outputs.msft_failed == 'false'
        run: |
          set -euo pipefail
          cd "${WORKDIR}/src"

          # Remove msft clone to free space and garbage collect
          cd "${WORKDIR}"
          rm -rf msft_src || true
          cd "${WORKDIR}/src"
          git reflog expire --all --expire=now || true
          git gc --prune=now --aggressive || true

          echo "Disk usage for ${WORKDIR}/src after cleanup:"
          du -sh "${WORKDIR}/src" || true
        shell: bash

      - name: Install build dependencies (self-hosted runner must permit sudo)
        if: steps.fetch_msft.outputs.msft_failed == 'false'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc fakeroot dpkg-dev curl cpio qemu-utils dwarves
        shell: bash

      - name: Build kernel (and optionally debs)
        if: steps.fetch_msft.outputs.msft_failed == 'false'
        run: |
          set -euo pipefail
          cd "${WORKDIR}/src"
          if [ -f "arch/x86/configs/config-wsl" ]; then
            echo "Using MSFT config-wsl as .config" 
            cp arch/x86/configs/config-wsl .config 
            # Ensure .config is valid for this kernel
            make olddefconfig < /dev/null || true
          else
            echo "config-wsl not found, falling back to defconfig" 
            make defconfig
          fi

          # Build
          make -j$(nproc)

          # Safe modules install and pruning flow to free space before any system install
          OUT="${WORKDIR}/modules_out"
          mkdir -p "$OUT"

          echo "Installing modules selected by .config into $OUT (INSTALL_MOD_PATH)..."
          # Install only the modules enabled by .config into a local OUT folder
          if ! make modules_install INSTALL_MOD_PATH="$OUT"; then
            echo "make modules_install failed; continuing cautiously"
          fi

          # Build a list of installed module basenames (what the .config selected)
          installed_list="$OUT/installed_ko_list.txt"
          if [ -d "$OUT" ]; then
            find "$OUT" -type f -name '*.ko' -printf '%f\n' | sort -u > "$installed_list" || true
          else
            touch "$installed_list"
          fi

          echo "Installed modules count: $(wc -l < "$installed_list" 2>/dev/null || echo 0)"

          # Guard: avoid deleting anything if installed_list is empty
          if [ ! -s "$installed_list" ]; then
            echo "installed_list is empty. Skipping auto-deletion to avoid removing all built modules"
            echo "Show top largest modules to help manual pruning:"
            find . -type f -name '*.ko' -exec du -h {} + | sort -h | tail -n 40 || true
          else
            # Find all built .ko in the source tree (relative paths)
            all_ko_list="$(mktemp)"
            find . -type f -name '*.ko' -printf '%P\n' | sort -u > "$all_ko_list" || true

            echo "Pruning .ko files that are not present in installed modules list..."
            removed_count=0
            while IFS= read -r ko_rel; do
              ko_basename="$(basename "$ko_rel")"
              if ! grep -Fxq "$ko_basename" "$installed_list"; then
                if [ -f "$ko_rel" ]; then
                  echo "Deleting $ko_rel (not in installed list)"
                  rm -fv "$ko_rel" || true
                  removed_count=$((removed_count+1))
                fi
              fi
            done < "$all_ko_list"

            echo "Removed $removed_count unneeded .ko files from source tree."
          fi

          echo "Disk usage AFTER pruning:"
          df -h || true
          du -sh . || true

          # Optionally proceed to install kernel image (this may touch system / and require space)
          # keep it non-failing to avoid blocking CI if it runs out of space
          if sudo make install; then
            echo "make install succeeded"
          else
            echo "make install failed or skipped (non-fatal)"
          fi
        shell: bash

      - name: Upload build artifacts
        if: steps.fetch_msft.outputs.msft_failed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-artifacts
          path: |
            ${WORKDIR}/src/arch/*/boot/*
            ${WORKDIR}/src/*.deb
            ${WORKDIR}/src/../*.deb
            ${WORKDIR}/src/*.tar.gz
            ${WORKDIR}/modules_out
