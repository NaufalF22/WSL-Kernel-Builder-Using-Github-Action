name: Merge and Build Kernel

on:
  workflow_dispatch:
    inputs:
      msft_branch:
        description: 'MSFT branch to fetch'
        required: false
        default: 'linux-msft-wsl-6.18.y'
      linux_branch:
        description: 'Linux branch to fetch'
        required: false
        default: linux-rolling-stable
      build_deb:
        description: 'Produce Debian packages'
        required: false
        default: 'false'
  schedule:
    # Check kernel.org for new commits on linux-rolling-stable every 6 hours.
    # Only triggers an actual build if the upstream commit changed since the
    # last successful build (see the check-update job below).
    - cron: '0 */6 * * *'

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      latest_sha: ${{ steps.check.outputs.latest_sha }}
    env:
      KERNEL_GIT: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
      LINUX_BRANCH: ${{ github.event.inputs.linux_branch || 'linux-rolling-stable' }}
    steps:
      - name: Checkout workflow repo (for build state)
        uses: actions/checkout@v4

      - id: check
        name: Compare latest kernel.org commit to last build
        run: |
          set -euo pipefail
          STATE_FILE=".github/state/last-linux-sha-${LINUX_BRANCH}.txt"

          latest_sha="$(git ls-remote "${KERNEL_GIT}" "refs/heads/${LINUX_BRANCH}" | cut -f1)"
          if [ -z "${latest_sha}" ]; then
            echo "Could not resolve branch '${LINUX_BRANCH}' on kernel.org" >&2
            exit 1
          fi
          echo "Latest upstream commit: ${latest_sha}"

          last_sha=""
          if [ -f "${STATE_FILE}" ]; then
            last_sha="$(cat "${STATE_FILE}")"
          fi
          echo "Last built commit:      ${last_sha:-<none recorded>}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manually triggered - building regardless of upstream state."
            should_build=true
          elif [ "${latest_sha}" != "${last_sha}" ]; then
            echo "New commit(s) found on ${LINUX_BRANCH} - build needed."
            should_build=true
          else
            echo "No new commits on ${LINUX_BRANCH} since last build - skipping."
            should_build=false
          fi

          echo "should_build=${should_build}" >> "$GITHUB_OUTPUT"
          echo "latest_sha=${latest_sha}" >> "$GITHUB_OUTPUT"
        shell: bash

  merge-build:
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true'
    runs-on: [ubuntu-latest]
    permissions:
      contents: write
    env:
      MSFT_REMOTE: https://github.com/microsoft/WSL2-Linux-Kernel.git
      KERNEL_GIT: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
      WORKDIR: ${{ github.workspace }}/kernel-work
      LINUX_BRANCH: ${{ github.event.inputs.linux_branch || 'linux-rolling-stable' }}
      MSFT_BRANCH: ${{ github.event.inputs.msft_branch || 'linux-msft-wsl-6.18.y' }}
      BUILD_DEB: ${{ github.event.inputs.build_deb || 'false' }}

    steps:
      - name: Checkout workflow repo (for scripts/artifacts)
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Free disk space on runner
        run: |
          set -euo pipefail
          echo "Disk usage before cleanup:"
          df -h /

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -a -f || true
          sudo apt-get clean || true

          echo "Disk usage after cleanup:"
          df -h /
        shell: bash

      - name: Prepare workdir
        run: |
          rm -rf "${WORKDIR}"
          mkdir -p "${WORKDIR}"
          echo "Disk usage:"
          df -h || true
          du -sh . || true

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc fakeroot dpkg-dev curl cpio qemu-utils dwarves
        shell: bash

      - name: Fetch kernel source
        run: |
          set -euo pipefail
          cd "${WORKDIR}"
          echo "Cloning kernel.org stable repo (shallow)..."
          git clone --depth=1 --branch "${LINUX_BRANCH}" "${KERNEL_GIT}" src
          cd src
          echo "Checked out $(git rev-parse --short HEAD) on ${LINUX_BRANCH}"
        shell: bash

      - id: fetch_msft
        name: Clone MSFT into separate folder
        # Config source only - don't fail the whole build if this can't be fetched.
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "${WORKDIR}"
          rm -rf msft_src || true
          # Try a shallow clone of the MSFT branch into msft_src
          if git clone --depth=1 --branch "${MSFT_BRANCH}" "${MSFT_REMOTE}" msft_src 2>/dev/null; then
            echo "Cloned msft/${MSFT_BRANCH} into msft_src"
            echo "msft_failed=false" >> "$GITHUB_OUTPUT"
          else
            # Fallback: clone default branch then try to fetch the requested branch
            if git clone --depth=1 "${MSFT_REMOTE}" msft_src 2>/dev/null; then
              cd msft_src
              if git fetch --depth=1 origin "${MSFT_BRANCH}" && git checkout "${MSFT_BRANCH}"; then
                echo "Fetched msft/${MSFT_BRANCH} into msft_src"
                echo "msft_failed=false" >> "$GITHUB_OUTPUT"
              else
                echo "Failed to fetch msft/${MSFT_BRANCH}" >&2
                echo "msft_failed=true" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            else
              echo "Failed to clone MSFT repo" >&2
              echo "msft_failed=true" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
        shell: bash

      - name: Copy arch/x86/configs/ from MSFT (prefer MSFT files)
        if: steps.fetch_msft.outputs.msft_failed == 'false'
        run: |
          set -euo pipefail
          cd "${WORKDIR}/src"

          # Delete the existing arch/x86/configs directory
          if [ -d "arch/x86/configs" ]; then
            echo "Deleting arch/x86/configs/..."
            git rm -r arch/x86/configs/ 2>/dev/null || rm -rf arch/x86/configs/
          fi

          # Copy arch/x86/configs/ from MSFT
          if [ -d "${WORKDIR}/msft_src/arch/x86/configs" ]; then
            echo "Copying arch/x86/configs/ from MSFT..."
            mkdir -p arch/x86/configs
            cp -rf "${WORKDIR}/msft_src/arch/x86/configs/"* arch/x86/configs/ 2>/dev/null || true
            git add arch/x86/configs/ || true
            if ! git diff --cached --quiet; then
              git commit -m "Replace arch/x86/configs with MSFT version" || true
            fi
          else
            echo "Warning: MSFT arch/x86/configs/ not found"
          fi
        shell: bash

      - name: Delete MSFT folder
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${WORKDIR}/msft_src" || true
          cd "${WORKDIR}/src"
          git reflog expire --all --expire=now || true
          git gc --prune=now --aggressive || true

          echo "Disk usage for ${WORKDIR}/src after cleanup:"
          df -h || true
          du -sh . || true
        shell: bash

      - name: Check disk usage before build kernel
        run: |
          echo "Disk usage:"
          df -h || true
          du -sh . || true
        shell: bash

      - name: Configure kernel
        run: |
          set -euo pipefail
          cd "${WORKDIR}/src"
          if [ -f "arch/x86/configs/config-wsl" ]; then
            echo "=== Using MSFT config-wsl as .config ==="
            cp arch/x86/configs/config-wsl .config
            # Ensure .config is valid for this kernel version
            make olddefconfig
          else
            echo "=== WARNING: config-wsl not found, falling back to defconfig ==="
            echo "=== defconfig builds the full desktop driver tree (nouveau, amdgpu, etc.)"
            echo "=== and WILL exhaust runner disk space. Check the MSFT clone step above."
            make defconfig
          fi

          # Strip debug info regardless of config source - keeps module/vmlinux
          # sizes sane on disk-constrained runners. Safe to drop for a WSL kernel.
          scripts/config --disable CONFIG_DEBUG_INFO || true
          scripts/config --disable CONFIG_DEBUG_INFO_DWARF4 || true
          scripts/config --disable CONFIG_DEBUG_INFO_DWARF5 || true
          scripts/config --set-val CONFIG_DEBUG_INFO_NONE y || true
          make olddefconfig
        shell: bash

      - name: Build kernel
        run: |
          set -euo pipefail
          cd "${WORKDIR}/src"
          if [ "${BUILD_DEB}" = "true" ]; then
            echo "Building bzImage, modules, and Debian packages..."
            make -j"$(nproc)" bzImage modules
            make -j"$(nproc)" bindeb-pkg
          else
            echo "Building bzImage and modules..."
            make -j"$(nproc)" bzImage modules
          fi

          echo "Disk usage after build:"
          df -h || true
          du -sh . || true
        shell: bash

      - id: locate_kernel
        name: Locate compiled kernel
        run: |
          set -euo pipefail
          cd "${WORKDIR}/src"

          echo "=== Known kernel output locations ==="
          for f in arch/x86/boot/bzImage vmlinux System.map .config; do
            if [ -f "$f" ]; then
              echo "FOUND: ${WORKDIR}/src/${f} ($(du -h "$f" | cut -f1))"
            else
              echo "MISSING: ${WORKDIR}/src/${f}"
            fi
          done

          echo ""
          echo "=== Debian packages (built one level above src, if build_deb=true) ==="
          find "${WORKDIR}" -maxdepth 1 -name "*.deb" -print || true

          echo ""
          echo "=== Kernel release version ==="
          kernelrelease="$(make -s kernelrelease)"
          echo "${kernelrelease}"
          echo "kernelrelease=${kernelrelease}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Stage release artifacts
        id: stage_artifacts
        run: |
          set -euo pipefail
          cd "${WORKDIR}/src"
          KREL="${{ steps.locate_kernel.outputs.kernelrelease }}"

          mkdir -p "${WORKDIR}/release-artifacts"

          if [ -f "arch/x86/boot/bzImage" ]; then
            cp "arch/x86/boot/bzImage" "${WORKDIR}/release-artifacts/bzImage-${KREL}"
          fi
          if [ -f "vmlinux" ]; then
            cp "vmlinux" "${WORKDIR}/release-artifacts/vmlinux-${KREL}"
          fi
          if [ -f "System.map" ]; then
            cp "System.map" "${WORKDIR}/release-artifacts/System.map-${KREL}"
          fi
          if [ -f ".config" ]; then
            cp ".config" "${WORKDIR}/release-artifacts/config-${KREL}"
          fi
          # .deb packages already carry the kernel version in their filename
          find "${WORKDIR}" -maxdepth 1 -name "*.deb" -exec cp {} "${WORKDIR}/release-artifacts/" \;

          echo "=== Staged release artifacts ==="
          ls -lh "${WORKDIR}/release-artifacts/"
        shell: bash

      - name: Find the artifacts
        run: |
          set -euo pipefail
          echo "Looking for artifacts..."
          find "${WORKDIR}/release-artifacts" -type f -print || true
        shell: bash

      - name: Collect kernel artifacts
        id: collect_artifacts
        run: |
          set -euo pipefail

          artifacts=$(find "${WORKDIR}/release-artifacts" -type f -print || true)

          if [ -z "${artifacts}" ]; then
            echo "No kernel artifacts found."
            echo "artifacts=" >> "$GITHUB_OUTPUT"
          else
            echo "artifacts<<EOF" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${artifacts}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Upload build artifacts
        if: steps.collect_artifacts.outputs.artifacts != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate_kernel.outputs.kernelrelease }}
          path: ${{ steps.collect_artifacts.outputs.artifacts }}

      - name: Publish to release page
        if: steps.collect_artifacts.outputs.artifacts != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ steps.locate_kernel.outputs.kernelrelease }}-run${{ github.run_number }}
          name: ${{ steps.locate_kernel.outputs.kernelrelease }}
          body: |
            Automated WSL kernel build.

            - Linux branch: `${{ env.LINUX_BRANCH }}` @ `${{ needs.check-update.outputs.latest_sha }}`
            - MSFT config branch: `${{ env.MSFT_BRANCH }}`
            - Debian packages built: `${{ env.BUILD_DEB }}`
            - Trigger: `${{ github.event_name }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: ${{ steps.collect_artifacts.outputs.artifacts }}
          draft: false
          prerelease: false

      - name: Record built commit SHA
        if: steps.collect_artifacts.outputs.artifacts != ''
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          mkdir -p .github/state
          STATE_FILE=".github/state/last-linux-sha-${LINUX_BRANCH}.txt"
          echo "${{ needs.check-update.outputs.latest_sha }}" > "${STATE_FILE}"

          git add "${STATE_FILE}"
          if ! git diff --cached --quiet; then
            git commit -m "Record built kernel commit ${{ needs.check-update.outputs.latest_sha }} (${{ steps.locate_kernel.outputs.kernelrelease }})"
            git push
          else
            echo "State file already up to date, nothing to commit."
          fi
        shell: bash
