name: Kernel Release Watcher

on:
  schedule:
    - cron: "0 0 * * *"  # runs once daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # required to trigger other workflows

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.compare.outputs.new_release }}
      latest_version: ${{ steps.fetch.outputs.latest_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest kernel release
        id: fetch
        run: |
          latest=$(curl -s https://www.kernel.org/releases.json | jq -r '.latest_stable.version')
          echo "Latest stable: $latest"
          echo "latest_version=$latest" >> "$GITHUB_OUTPUT"

      - name: Compare with stored version
        id: compare
        run: |
          stored_file=".github/last_kernel_version.txt"
          stored=""
          if [ -f "$stored_file" ]; then
            stored=$(cat "$stored_file")
          fi
          echo "Stored: $stored | Latest: ${{ steps.fetch.outputs.latest_version }}"
          if [ "$stored" != "${{ steps.fetch.outputs.latest_version }}" ]; then
            echo "new_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update stored kernel version
        if: steps.compare.outputs.new_release == 'true'
        run: |
          mkdir -p .github
          echo "${{ steps.fetch.outputs.latest_version }}" > .github/last_kernel_version.txt

      - name: Commit updated version file
        if: steps.compare.outputs.new_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/last_kernel_version.txt
          git commit -m "chore: update stored kernel version to ${{ steps.fetch.outputs.latest_version }}" || echo "No changes to commit"
          git push

  trigger-x86:
    needs: check-release
    if: needs.check-release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger x86.yml
        run: |
          gh workflow run x86.yml --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-arm:
    needs: check-release
    if: needs.check-release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger arm.yml
        run: |
          gh workflow run arm.yml --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
